<!doctype html>
<html lang="es">
  <head>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon_32.png" />
    <link rel="apple-touch-icon" href="./favicon_180.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MARSCEPTION</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d17; }
      /* touch-action: evita el zoom por doble toque en iOS y el desplazamiento al manejar con los botones táctiles. */
      #app { width: 100%; height: 100%; touch-action: manipulation; }
      #girar { display: none; }
      /* Teléfono en vertical: el juego (16:9) queda como una franja; se pide girar el teléfono. */
      @media (orientation: portrait) and (max-width: 820px) {
        #girar {
          display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
          background: #0b0d17; color: #ffd166; font: 18px/1.5 monospace; text-align: center; padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="girar">⟳ Gira tu teléfono para jugar MARSCEPTION<br />Rotate your phone to play</div>
    <!-- Control de celular (control-celular/): con ?mando en la URL y el relay corriendo en esta compu (puerto 8787), carga su puente.
         Solo en local (http); la demo pública (https) nunca lo intenta. Sin relay, el script no carga y el juego sigue igual. -->
    <script>
      (function () {
        if (location.protocol !== 'http:') return;
        // Solo si se pide: ?mando en la URL (se recuerda) o la marca marsception.mando; así el juego local no deja un error
        // de consola en cada carga (playtest de Leo, B7).
        var pedir = /[?&]mando\b/.test(location.search);
        try { if (pedir) localStorage.setItem('marsception.mando', '1'); pedir = pedir || localStorage.getItem('marsception.mando') === '1'; } catch (e) {}
        if (!pedir) return;
        var s = document.createElement('script');
        s.src = 'http://' + location.hostname + ':8787/puente.js';
        s.async = true;
        s.onerror = function () { s.remove(); };
        document.head.appendChild(s);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
